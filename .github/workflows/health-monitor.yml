name: Health Monitor

# Production health probe. Runs every 10 minutes to confirm the deployed
# /api/health endpoint is reachable and returning 200 with both database
# and redis showing connected.
#
# Skips silently if PROD_HEALTH_URL is not configured — useful while there
# is no prod deployment yet, so this workflow does not spam failure
# emails.
#
# Secrets required:
#   PROD_HEALTH_URL — full URL of the health endpoint (https://...)
#
# Optional secrets:
#   ALERT_WEBHOOK_URL — Slack / Teams / Discord-compatible webhook that
#                      receives a JSON payload `{ text: "...", url: "...",
#                      run: "..." }` on failure.
#
# Cost note: this repo is public, so GH Actions minutes are free. ~4320 runs
# per month at 10-minute cadence. If you want to back off, change the cron
# to "*/30 * * * *" (every 30 min) or disable the schedule entirely.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Skip if PROD_HEALTH_URL is not set
        id: gate
        run: |
          if [ -z "${{ secrets.PROD_HEALTH_URL }}" ]; then
            echo "PROD_HEALTH_URL not configured — skipping probe."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Probe /api/health
        if: steps.gate.outputs.skip == 'false'
        id: probe
        run: |
          URL="${{ secrets.PROD_HEALTH_URL }}"
          STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 10 "$URL" || echo "000")
          BODY=$(cat /tmp/health.json 2>/dev/null || echo "{}")

          {
            echo "### Health probe @ $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "- HTTP status: \`$STATUS\`"
            echo ""
            echo '```json'
            echo "$BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "body<<HEALTH_EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "HEALTH_EOF" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Health probe failed: HTTP $STATUS"
            exit 1
          fi

      - name: Notify on failure
        if: failure() && steps.gate.outputs.skip == 'false' && env.ALERT_WEBHOOK_URL != ''
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          PAYLOAD=$(printf '{"text":"WholesaleHub health probe FAILED — HTTP %s","url":"%s","run":"%s"}' \
            "${{ steps.probe.outputs.status }}" \
            "${{ secrets.PROD_HEALTH_URL }}" \
            "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          curl -s -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$ALERT_WEBHOOK_URL" || true
